deploymentConfig: {}

envFrom:
  - secretRef:
      name: app-env

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-cf-prod"
  hosts:
    - host: safe-settings.go1.co
      paths:
        - path: /
          pathType: Prefix
  tls:
   - secretName: safe-settings-go1-co-tls
     hosts:
       - safe-settings.go1.co
